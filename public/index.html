<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#173326">
    <title>ドミニオン - カードゲーム</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- アニメーションのためのオーバーレイ -->
    <div id="animation-overlay"></div>

    <!-- 手番とフェーズ、残りリソースを常に表示するヘッダー -->
    <header id="topbar">
        <div class="topbar-row">
            <div class="brand">
                <h1>ドミニオン</h1>
                <button id="settings-btn" class="icon-btn" aria-label="設定">⚙</button>
            </div>
            <div id="game-status">ゲームの準備をしています...</div>
        </div>
        <div id="turn-stats"></div>
        <div id="latest-log" aria-live="polite"></div>
    </header>

    <main id="table">
        <section id="players-info">
            <!-- プレイヤー情報はJavaScriptで動的に生成されます -->
        </section>

        <section id="supply-section" class="panel">
            <h2>サプライ <span class="hint">タップで購入・長押しで説明</span></h2>
            <div id="supply-piles">
                <!-- サプライパイルはJavaScriptで動的に生成されます -->
            </div>
        </section>

        <details id="game-log" class="panel">
            <summary>ゲームログ</summary>
            <div id="log-entries"></div>
        </details>
    </main>

    <!-- 場札はサプライと手札のあいだに常に表示する -->
    <section id="play-area">
        <h2>場札</h2>
        <div id="played-cards"></div>
    </section>

    <!-- 手札と操作ボタンは親指の届く画面下部に固定 -->
    <footer id="dock">
        <div id="game-controls">
            <div id="action-buttons">
                <!-- アクションボタンはJavaScriptで動的に生成されます -->
            </div>
            <button id="end-turn-btn" disabled>ターン終了</button>
        </div>
        <!-- 左から山札・手札・捨て札 -->
        <div class="dock-main">
            <div id="deck" class="pile">
                <div id="deck-pile" class="pile-slot"></div>
                <span class="pile-label">山札</span>
            </div>
            <div id="hand">
                <div id="hand-cards"></div>
            </div>
            <div id="discard" class="pile">
                <div id="discard-cards" class="pile-slot"></div>
                <span class="pile-label">捨て札</span>
            </div>
        </div>
    </footer>

    <div id="game-modal" class="modal">
        <div class="modal-content">
            <span class="close" role="button" aria-label="閉じる">&times;</span>
            <div id="modal-title"></div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- JavaScriptファイル - ES Modulesとして読み込み -->
    <script type="module" src="js/main.js"></script>

    <!-- 後方互換性のために残しているファイル -->
    <script type="module" src="js/game-models.js"></script>
</body>
</html>
